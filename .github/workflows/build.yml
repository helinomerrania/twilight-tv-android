name: Build the TV app

# Runs every time something in the project changes (or by hand from the Actions tab).
# Changes to the app on the main branch are published as the latest release (twilight-tv.apk);
# a change to only the tests, the documents or the build's own steps isn't (the TVs would download
# the same app again), and other branches are only built, as a test.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04   # a fixed build machine, so GitHub updates don't change the build
    steps:
      - name: Get the project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # the whole history, to see whether the app changed since the last release

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test and build the APK
        shell: bash
        run: |
          chmod +x gradlew
          # The tests (app/src/test) first: if one fails, nothing is built or published
          ./gradlew --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk twilight-tv.apk
          ls -l twilight-tv.apk
          # what the app's tests found, as a note on the run
          r=app/build/test-results/testDebugUnitTest
          tests=$(grep -ho '<testsuite [^>]*tests="[0-9]*"' $r/TEST-*.xml | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | awk '{ n += $1 } END { print n + 0 }' || true)
          checks=$(cat $r/TEST-*.xml | grep -c '^  ok   ' || true)
          echo "::notice title=App tests::$tests tests passed, $checks small checks among them"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/pages/package-lock.json

      - name: Test the pages
        shell: bash
        run: |
          # The TV, phone and menu pages in a browser (tests/pages): if a check fails, nothing is published.
          # They use Chrome, the app's own web server (compiled here, with the org.json Gradle fetched for the
          # tests above) and Python's openpyxl and Pillow for the menu's Excel files.
          cd tests/pages
          npm ci --no-audit --no-fund
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install --quiet openpyxl pillow
          export PATH="$RUNNER_TEMP/py/bin:$PATH"
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          node run.js 2>&1 | tee "$GITHUB_WORKSPACE/pages.log"
          echo "::notice title=Page tests::$(tail -n 1 "$GITHUB_WORKSPACE/pages.log")"

      - name: Show what went wrong
        if: failure()
        shell: bash
        run: |
          # Gradle's own explanation, any compile errors and any failed tests, as notes on the run
          # ("|| true": a search that finds nothing mustn't end the step before the notes are written)
          enc() { sed -e 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }'; }
          wrong=$(grep -A 12 "What went wrong" build.log | head -n 40 | enc || true)
          errors=$(grep -E -A 2 "error:|e: |\.java:[0-9]+:" build.log | head -n 60 | enc || true)
          tests=$(grep -E -A 3 " FAILED$" build.log | head -n 60 | enc || true)
          # the page tests' failed checks, each with its suite
          pages=$(awk '/^=== /{ s = $0; sub(/^=== /, "", s); sub(/ \([0-9]+ s\)$/, "", s) } /^The page tests/{ s = "in all" } /^  FAIL/{ print s ":" substr($0, 7) }' pages.log 2>/dev/null | head -n 40 | enc || true)
          [ -n "$wrong" ] && echo "::error title=What went wrong::$wrong"
          [ -n "$errors" ] && echo "::error title=Compile errors::$errors"
          [ -n "$tests" ] && echo "::error title=Failed tests::$tests"
          [ -n "$pages" ] && echo "::error title=Failed page checks::$pages"
          true

      - name: Keep the APK with this build
        uses: actions/upload-artifact@v4
        with:
          name: twilight-tv
          path: twilight-tv.apk

      - name: Publish it as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The old test version's channel ("firefox"): no TV uses it any more (this line can go later)
          gh release delete firefox --cleanup-tag --yes 2>/dev/null || true
          # Only when the app itself changed since the last release, or when run by hand
          last=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [ "${{ github.event_name }}" != workflow_dispatch ] && [ -n "$last" ] && git rev-parse -q --verify "refs/tags/$last" > /dev/null \
             && git diff --quiet "$last" HEAD -- app ':(exclude)app/src/test' build.gradle settings.gradle gradle.properties gradle; then
            echo "::notice title=Not published::The app is the same as in $last (only tests, documents or the build's own steps changed): the TVs have nothing new to install."
            exit 0
          fi
          # Tagged with the app's version number, which the TVs compare with their own
          gh release create "build-$((100000 + ${{ github.run_number }}))-${{ github.run_attempt }}" twilight-tv.apk \
            --target "${{ github.sha }}" \
            --title "Twilight TV, build ${{ github.run_number }}" \
            --notes "Install twilight-tv.apk on the TVs. It installs over the previous build, and keeps each TV's settings and PIN." \
            --latest
          # Only the newest three builds are kept (each is about 85 MB)
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --cleanup-tag --yes || true; done
