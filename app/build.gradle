plugins {
    id 'com.android.application'
}

// Each build on GitHub gets a higher version number, so a new APK installs over the old
// one (and each TV keeps its settings and PIN). Since the app brought its own engine,
// version numbers start at 100000, above every earlier build.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace = 'com.twilightcafe.tvplayer'
    compileSdk {
        version = release(37) {
            minorApiLevel = 1                        // Firefox's engine 157 needs Android's 37.1 tools or newer
        }
    }

    defaultConfig {
        applicationId = 'com.twilightcafe.tvplayer'
        minSdk = 26                                  // Firefox's engine needs Android 8.0 or newer
        targetSdk = 35
        versionCode = 100000 + buildNumber
        versionName = "1.${buildNumber}"
        // The GitHub repository the app is built from: settings.json and updates come from there
        buildConfigField "String", "REPO", "\"" + (System.getenv('GITHUB_REPOSITORY') ?: '') + "\""
        ndk {
            abiFilters.add('armeabi-v7a')            // Firefox's engine for TV boxes: 32-bit ARM runs on all of them
        }
    }

    packaging {
        // Firefox's engine compressed inside the APK, as before: a 90 MB download instead of 160 MB
        // (the box unpacks it when installing)
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            // the same licence and Java-module files come with several of Firefox's engine's libraries
            excludes.addAll(['META-INF/versions/9/module-info.class', 'META-INF/LICENSE*', 'META-INF/NOTICE*',
                             'META-INF/DEPENDENCIES', 'META-INF/*.kotlin_module'])
        }
    }

    buildFeatures {
        buildConfig = true
    }

    // The same key signs every build; Android only updates an app signed with the same key.
    signingConfigs {
        release {
            storeFile = file('twilight-tv.keystore')
            storeType = 'pkcs12'
            storePassword = 'twilight-tv-key'
            keyAlias = 'twilight-tv'
            keyPassword = 'twilight-tv-key'
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
}

dependencies {
    // Firefox's engine (GeckoView), inside the app: the TV boxes' own engine is too old for YouTube's
    // controls, and they won't take a newer one. Mozilla's newest release; it needs Android 8.0 or newer.
    implementation 'org.mozilla.geckoview:geckoview-armeabi-v7a:157.0.20261005135250'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.11.0'
}
