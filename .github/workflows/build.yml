name: Build the TV app

# Runs every time something in the project changes (or by hand from the Actions tab).
# Changes on the main branch are published as the latest release (twilight-tv.apk);
# other branches are only built, as a test.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04   # a fixed build machine, so GitHub updates don't change the build
    steps:
      - name: Get the project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test and build the APK
        shell: bash
        run: |
          chmod +x gradlew
          # The tests (app/src/test) first: if one fails, nothing is built or published
          ./gradlew --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk twilight-tv.apk
          ls -l twilight-tv.apk

      - name: Show what went wrong
        if: failure()
        shell: bash
        run: |
          # Gradle's own explanation, any compile errors and any failed tests, as notes on the run
          # ("|| true": a search that finds nothing mustn't end the step before the notes are written)
          enc() { sed -e 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }'; }
          wrong=$(grep -A 12 "What went wrong" build.log | head -n 40 | enc || true)
          errors=$(grep -E -A 2 "error:|e: |\.java:[0-9]+:" build.log | head -n 60 | enc || true)
          tests=$(grep -E -A 3 " FAILED$" build.log | head -n 60 | enc || true)
          [ -n "$wrong" ] && echo "::error title=What went wrong::$wrong"
          [ -n "$errors" ] && echo "::error title=Compile errors::$errors"
          [ -n "$tests" ] && echo "::error title=Failed tests::$tests"
          true

      - name: Keep the APK with this build
        uses: actions/upload-artifact@v4
        with:
          name: twilight-tv
          path: twilight-tv.apk

      - name: Publish it as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tagged with the app's version number, which the TVs compare with their own
          gh release create "build-$((100000 + ${{ github.run_number }}))-${{ github.run_attempt }}" twilight-tv.apk \
            --target "${{ github.sha }}" \
            --title "Twilight TV, build ${{ github.run_number }}" \
            --notes "Install twilight-tv.apk on the TVs. It installs over the previous build, and keeps each TV's settings and PIN." \
            --latest
          # Only the newest three builds are kept (each is about 85 MB)
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --cleanup-tag --yes || true; done

      - name: Also as the test version's release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The TV that tried the test version (build 15) looks for updates here. This brings
          # it onto the normal releases; the step can go once it has updated.
          cp twilight-tv.apk twilight-tv-gecko.apk
          gh release delete firefox --cleanup-tag --yes || true
          gh release create firefox twilight-tv-gecko.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Twilight TV with Firefox's engine (test), build ${{ github.run_number }}" \
            --notes "The test version is now the normal app. Install twilight-tv.apk from the latest release instead."
