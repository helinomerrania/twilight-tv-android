<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- YouTube refuses embeds that don't say which website they are on ("Error 153") -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>TV Player</title>
<style>
  :root { --u: 1px; --stageW: 100vw; --stageH: 100vh; --colW: 0px; --bandH: 0px;
          --night: #0b1030; --cream: #fff1e0; --mist: rgba(255, 241, 224, .64); --sun: #ffcf8a; --ember: #f0985c; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1030; cursor: none; }
  /* With the info panel: the video sits top left like a window on the lake; the night sky's
     column on the right (time, weather, prices), the shore along the bottom (music, QR codes) */
  body.with-panel { background: radial-gradient(70% 55% at 32% 112%, rgba(240, 152, 92, .2), transparent 70%),
                                linear-gradient(#0b1030, #121641 62%, #1b1a49); }
  /* Where the video and the café screen are: the whole screen, or the top left with the panel */
  #stage { position: fixed; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; z-index: 1;
           container-type: size; background: #0b1030; }
  /* The player: drawn big (for quality), scaled to fit exactly, faded in and out by the script */
  #player { position: absolute; left: 0; top: 0; z-index: 1; border: 0; transform-origin: 0 0; opacity: 0; }
  /* Invisible layer over everything: taps and clicks can't pause the video or open YouTube */
  #shield { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 5; }
  /* Small speaker icon, shown only while the TV's browser is blocking sound */
  #muted { position: absolute; right: 3vmin; bottom: 3vmin; z-index: 3; width: 5vmin; height: 5vmin;
           display: none; opacity: .5; pointer-events: none; }
  /* Song volume, shown for a moment after the remote's up/down arrows */
  #vol { position: absolute; left: 3vmin; bottom: 3vmin; z-index: 3; display: none; padding: .35em .8em;
         border-radius: .5em; background: rgba(10, 14, 44, .75); color: #fff1e0;
         font: 600 3vmin/1.3 system-ui, sans-serif; pointer-events: none; }
  /* Setup problems only, on top of the café screen */
  /* Quality setup's instructions: top left, clear of YouTube's controls (bottom, and the top right corner),
     and inside the part of the picture every TV shows */
  #setupNote { position: fixed; top: 6vh; left: 6vw; z-index: 6; display: none; width: 54vw; width: min(54vw, 46rem);
               padding: 1.1em 1.4em; border-radius: .8em; background: rgba(10, 14, 44, .88); color: #fff1e0; pointer-events: none;
               font: 500 2.4vmin/1.5 system-ui, sans-serif; text-shadow: none; }
  #setupNote b { color: #ffcf8a; }
  #setupStatus { margin-top: .6em; opacity: .8; font-size: .85em; }
  #note { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); z-index: 3; display: none;
          max-width: 80%; padding: .8em 1.2em; border-radius: .6em; background: rgba(10, 14, 44, .85);
          color: #ffe9d6; text-align: center; font: 2.4vmin/1.5 system-ui, sans-serif; pointer-events: none; }
  /* Test mode only (?debug=1) */
  #debug { position: fixed; top: 12px; left: 12px; z-index: 7; display: none; max-width: 75%;
           padding: 10px 14px; border-radius: 8px; background: rgba(0, 0, 0, .75); color: #fff;
           font: 15px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; pointer-events: none; }

  /* ---------- the info panel ---------- */
  /* Numbers (the time, the temperature, prices) in Fraunces' soft serif digits (OFL), all one width;
     words in the TV's own sans-serif, which also has Kurdish */
  #panel, #band { position: fixed; z-index: 2; display: none; box-sizing: border-box; color: var(--cream);
                  font-family: Roboto, "Noto Sans", "Noto Naskh Arabic", "Noto Sans Arabic", system-ui, sans-serif; }
  body.with-panel #panel, body.with-panel #band { display: flex; }
  :where(#panel, #band) :where(p, dl, dd, figure) { margin: 0; }
  .num { font-family: "TwilightNum", "Noto Serif", Georgia, serif; font-feature-settings: "lnum"; }
  #panel { top: 0; right: 0; width: var(--colW); height: 100%; flex-direction: column; gap: calc(30 * var(--u));
           padding: calc(46 * var(--u)) calc(44 * var(--u)) calc(38 * var(--u)) calc(30 * var(--u)); overflow: hidden; }
  #clock { display: flex; align-items: flex-start; gap: calc(8 * var(--u)); font-size: calc(96 * var(--u)); line-height: .95;
           font-weight: 400; letter-spacing: -.01em; white-space: nowrap; }
  #ampm { font: 500 calc(24 * var(--u))/1 Roboto, "Noto Sans", "Noto Naskh Arabic", sans-serif; color: var(--mist);
          margin-top: calc(10 * var(--u)); letter-spacing: .02em; }
  #date { margin-top: calc(16 * var(--u)); font-size: calc(28 * var(--u)); line-height: 1.3; font-weight: 500; }
  #hijri { font-size: calc(22 * var(--u)); line-height: 1.35; color: var(--mist); }
  #greeting { margin-top: calc(10 * var(--u)); font-size: calc(27 * var(--u)); line-height: 1.3; font-weight: 600; color: var(--sun); }
  #greeting:empty { display: none; }
  #wnow { display: flex; align-items: center; gap: calc(14 * var(--u)); }
  #wicon { width: calc(78 * var(--u)); height: calc(78 * var(--u)); flex: none; }
  #temp { font-size: calc(80 * var(--u)); line-height: 1; }
  #wwords { margin-top: calc(10 * var(--u)); font-size: calc(25 * var(--u)); line-height: 1.3; }
  #whilo { display: flex; flex-wrap: wrap; column-gap: calc(14 * var(--u)); font-size: calc(22 * var(--u)); line-height: 1.35; color: var(--mist); }
  #pricesHead { font-size: calc(22 * var(--u)); line-height: 1.3; font-weight: 600; color: var(--sun); margin-bottom: calc(6 * var(--u)); }
  #priceList div { display: flex; align-items: baseline; justify-content: space-between; gap: calc(12 * var(--u));
                   padding: calc(5 * var(--u)) 0; }
  #priceList dt { font-size: calc(23 * var(--u)); line-height: 1.3; color: var(--mist); overflow-wrap: anywhere; }
  #priceList dd { font-size: calc(29 * var(--u)); line-height: 1.2; white-space: nowrap; }
  #pricesAt { margin-top: calc(6 * var(--u)); font-size: calc(18 * var(--u)); color: var(--mist); }
  #credit { margin-top: auto; font-size: calc(15 * var(--u)); line-height: 1.3; color: var(--mist); opacity: .8; }
  #band { left: 0; bottom: 0; width: var(--stageW); height: var(--bandH); align-items: center; gap: calc(36 * var(--u));
          padding: calc(22 * var(--u)) calc(40 * var(--u)) calc(30 * var(--u)) calc(48 * var(--u)); }
  /* The shoreline under the video: the same warm line as on the lake */
  #band::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: calc(2 * var(--u));
                  background: linear-gradient(90deg, rgba(255, 178, 122, 0), rgba(255, 196, 140, .75) 50%, rgba(255, 178, 122, 0)); }
  #music { flex: 1 1 auto; min-width: 0; }
  #music .lbl, #nextLbl { color: var(--mist); }
  #nowLbl { font-size: calc(20 * var(--u)); line-height: 1.3; }
  #nowTitle { font-size: calc(38 * var(--u)); line-height: 1.25; font-weight: 600; }
  #nowSinger { font-size: calc(25 * var(--u)); line-height: 1.3; color: var(--mist); }
  #nextLine { margin-top: calc(10 * var(--u)); font-size: calc(22 * var(--u)); line-height: 1.3; }
  #nowTitle, #nowSinger, #nextLine { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .code { display: flex; align-items: center; gap: calc(16 * var(--u)); flex: none; max-width: calc(400 * var(--u)); }
  .code .qr { width: calc(164 * var(--u)); height: calc(164 * var(--u)); flex: none; border-radius: calc(10 * var(--u));
              overflow: hidden; background: var(--cream); }
  .code .qr svg { display: block; width: 100%; height: 100%; }
  .code figcaption { display: flex; flex-direction: column; gap: calc(4 * var(--u)); max-width: calc(210 * var(--u)); }
  .code b { font-size: calc(30 * var(--u)); line-height: 1.2; font-weight: 600; }
  .code span { font-size: calc(21 * var(--u)); line-height: 1.3; color: var(--mist); overflow-wrap: anywhere; }
  .code span.pw { color: var(--cream); }
  /* Right-to-left words (Kurdish): everything lines up on the right, whatever the song's own language */
  #panel[dir="rtl"] p, #band[dir="rtl"] p, #band[dir="rtl"] figcaption { text-align: right; }
  [hidden] { display: none !important; }
</style>

  /* Café screen: twilight over Lake Dukan. It is what the TV shows whenever no video is on. */
  #brand { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 0; overflow: hidden; background: #0b1030; }
  #brand svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #brand .name { position: absolute; left: 0; right: 0; top: 33%; transform: translateY(-50%); margin: 0;
                 padding: 0 6vw; text-align: center; font-family: "TwilightName", "Noto Naskh Arabic", "Noto Sans Arabic", Tahoma, sans-serif;
                 font-weight: 700; font-size: 11vmin; font-size: min(11cqmin, 7.6cqw); line-height: 1.5; color: #fff1e0;
                 text-shadow: 0 0 .5em rgba(255, 171, 107, .35), 0 .04em .02em rgba(20, 10, 40, .5); transition: opacity .6s ease; }
  /* A greeting on special days, or why the music stopped for a moment */
  #brandNote { position: absolute; left: 0; right: 0; top: 47%; transform: translateY(-50%); margin: 0; padding: 0 6%;
               text-align: center; color: #ffcf8a; font: 600 4.4vmin/1.4 Roboto, "Noto Naskh Arabic", "Noto Sans Arabic", system-ui, sans-serif;
               font-size: min(4.4cqmin, 3.2cqw); text-shadow: 0 0 .6em rgba(255, 171, 107, .35); transition: opacity .6s ease; }
  /* Between songs: the café's own messages and pictures, from the phone page */
  #slide { position: absolute; top: 0; right: 0; bottom: 0; left: 0; opacity: 0; transition: opacity .6s ease; }
  #slide.on { opacity: 1; }
  #slide img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  #slide .msg { position: absolute; left: 0; right: 0; top: 36%; transform: translateY(-50%); margin: 0; padding: 0 8%;
                text-align: center; color: #fff1e0; font: 600 6.4vmin/1.45 Roboto, "Noto Naskh Arabic", "Noto Sans Arabic", system-ui, sans-serif;
                font-size: min(var(--msg, 6.4cqmin), 5cqw); text-wrap: balance; overflow-wrap: anywhere;
                text-shadow: 0 0 .5em rgba(255, 171, 107, .35), 0 .04em .02em rgba(20, 10, 40, .5); }
  #brand.slide-on .name, #brand.slide-on #brandNote { opacity: 0; }
  /* One slow motion: the light behind the mountains and its path on the water breathe together.
     Only opacity of whole layers changes, so the TV's graphics chip does the work. */
  #brand .glow { will-change: opacity; animation: breathe 12s ease-in-out infinite alternate; }
  @keyframes breathe { from { opacity: .68; } to { opacity: 1; } }
  /* Special days: only that day's things show; fires and candles flicker gently */
  #brand [data-day] { display: none; }
  #brand.day-newroz [data-day~="newroz"], #brand.day-eidFitr [data-day~="eidFitr"], #brand.day-eidAdha [data-day~="eidAdha"],
  #brand.day-newYear [data-day~="newYear"], #brand.day-barat [data-day~="barat"] { display: inline; }
  #brand .flicker { animation: flicker 2.6s ease-in-out infinite alternate; }
  #brand .flicker.b { animation-duration: 3.4s; animation-delay: -1.2s; }
  #brand .flicker.c { animation-duration: 2.1s; animation-delay: -.6s; }
  @keyframes flicker { from { opacity: .62; } to { opacity: 1; } }
  #brand .burst { animation: burst 5s ease-in-out infinite; }
  #brand .burst.b { animation-delay: -1.7s; }
  #brand .burst.c { animation-delay: -3.3s; }
  @keyframes burst { 0%, 100% { opacity: .25; } 45% { opacity: 1; } }
  body.video-on #brand .glow, body.video-on #brand .flicker, body.video-on #brand .burst { animation-play-state: paused; }   /* rest while a video covers them */
  @media (prefers-reduced-motion: reduce) { #brand .glow, #brand .flicker, #brand .burst { animation: none; } }

<div id="stage">
<div id="brand" aria-hidden="true">
  <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">

      <circle cx="1500" cy="212" r="47" fill="#fff1e0" mask="url(#crescentCut)"/>

      <circle cx="1460" cy="232" r="190" fill="url(#moonGlow)"/>
      <circle cx="1460" cy="232" r="56" fill="#fff4e6"/>

    </g>

        <stop offset=".35" stop-color="#f59a62" stop-opacity=".45"/>
        <stop offset="1" stop-color="#f59a62" stop-opacity="0"/>

  </svg>
  <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">

        <stop offset="1" stop-color="#3b2a55"/>
      </linearGradient>

      </linearGradient>
      <mask id="water"><rect x="0" y="800" width="1920" height="280" fill="url(#fade)"/></mask>

        <path fill="#2a2046" d="M0 720 L110 700 L210 712 L320 676 L430 704 L540 690 L640 718 L760 736 L880 745 L960 748 L1040 744 L1150 730 L1260 700 L1360 684 L1460 706 L1580 668 L1700 700 L1820 690 L1920 704 L1920 800 L0 800Z"/>
        <path fill="#141028" d="M0 778 L120 766 L260 780 L400 762 L560 784 L720 774 L880 788 L1040 790 L1200 778 L1360 786 L1500 768 L1660 782 L1800 770 L1920 780 L1920 800 L0 800Z"/>

    <rect x="0" y="799" width="1920" height="2" fill="url(#shore)"/>

  <svg class="glow" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">

  <svg id="themeFront" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">

      <radialGradient id="fireGlow" cx=".5" cy=".5" r=".5">

<script>
  // Stars: spread evenly, fewer towards the horizon, drawn once
  (function () {
    var g = document.getElementById("stars"), ns = "http://www.w3.org/2000/svg";
    for (var i = 1; i <= 42; i++) {
      var c = document.createElementNS(ns, "circle");
      c.setAttribute("cx", (((i * 0.7548776662) % 1) * 1920).toFixed(1));
      c.setAttribute("cy", (24 + Math.pow((i * 0.5698402910) % 1, 1.4) * 480).toFixed(1));
      c.setAttribute("r", (0.7 + ((i * 7) % 10) / 9).toFixed(2));
      c.setAttribute("opacity", (0.25 + ((i * 3) % 10) / 14).toFixed(2));
      g.appendChild(c);
    }
    function el(parent, name, attrs) {
      var e = document.createElementNS(ns, name);
      for (var k in attrs) e.setAttribute(k, attrs[k]);
      parent.appendChild(e);
      return e;
    }
    // New Year: four bursts of fireworks, fading in and out one after another
    [[420, 245, 92, "#ffcf8a", ""], [800, 150, 70, "#f0985c", "b"], [1290, 262, 104, "#fff1e0", "c"], [1650, 168, 80, "#ff9f8a", "b"]].forEach(function (f) {
      var b = el(document.getElementById("fireworks"), "g", { "class": "burst " + f[4], stroke: f[3], fill: f[3], "stroke-width": 3, "stroke-linecap": "round" });
      for (var i = 0; i < 16; i++) {
        var a = i / 16 * 2 * Math.PI, cs = Math.cos(a), sn = Math.sin(a);
        el(b, "line", { x1: (f[0] + cs * f[2] * .3).toFixed(1), y1: (f[1] + sn * f[2] * .3).toFixed(1), x2: (f[0] + cs * f[2] * .86).toFixed(1), y2: (f[1] + sn * f[2] * .86).toFixed(1) });
        el(b, "circle", { cx: (f[0] + cs * f[2]).toFixed(1), cy: (f[1] + sn * f[2]).toFixed(1), r: 3.2, stroke: "none" });
      }
    });
    // Newroz: fires on the peaks around the lake
    [[240, 585], [410, 560], [540, 548], [1350, 520], [1450, 505], [1570, 512]].forEach(function (p, i) {
      var g = el(document.getElementById("fires"), "g", { "class": "flicker " + ["", "b", "c"][i % 3], transform: "translate(" + p[0] + " " + p[1] + ")" });
      el(g, "circle", { cx: 0, cy: -16, r: 64, fill: "url(#fireGlow)" });
      el(g, "use", { href: "#flame", fill: "#f0784e" });
      el(g, "use", { href: "#flame", fill: "#ffcf6a", transform: "scale(.56)" });
    });
    // Eid: lanterns hanging from the top
    [[220, 128], [360, 74], [1700, 104], [1830, 150]].forEach(function (p, i) {
      var g = el(document.getElementById("lanterns"), "g", { transform: "translate(" + p[0] + " 0)" });
      el(g, "line", { x1: 0, y1: 0, x2: 0, y2: p[1], stroke: "#ffcf8a", "stroke-opacity": .55, "stroke-width": 2 });

<script>
/* ============================ SETTINGS ============================ */
// Test mode: add ?debug=1 to the end of the page address to see what is playing,
// the picture quality YouTube picked, the volume, ads skipped and any problems.
var SETTINGS = {
  // Your YouTube playlist link (or just its ID). The playlist must be Public or Unlisted.
  // Adding ?list=ANOTHER_PLAYLIST_ID to the end of the page address overrides this.
  playlist: "https://www.youtube.com/playlist?list=PL_6oD4DKbNOvlb8kOY9APBXjC_EtR6eYK",

  // Highest picture quality to ask YouTube for: 2160 = 4K, 1440, or 1080 = Full HD.
  // 4K needs roughly 20 Mbps of internet per TV. If videos keep buffering, use 1080.
  quality: 2160,

  // Your café's name on the café screen, shown whenever a video isn't: while a song
  // loads, between songs, during pauses and instead of ads.
  brandName: "کافتریا و ڕێستورانتی توایڵایت",

  // Seconds the café screen stays up at the start of each song (and after any pause)
  // while YouTube's title is on its own screen. The song's sound already plays.
  // The picture isn't cropped for this. If you still catch the title, raise this to 5.
  titleSeconds: 4,

  // Seconds at the end of each song when the café screen covers the picture, so
  // YouTube's end cards never show. The song itself plays to the end. 0 = off.
  brandEnding: 10,

  // Fade in and fade out between songs, in seconds (0 = no fade).
  fadeIn: 2,
  fadeOut: 3,

  // Volume the page plays at (0-100). On each TV, the remote's up/down arrows
  // turn the song that is playing up or down, and that TV remembers it.
  volume: 100,

  // Fixed volumes for particular songs on every TV, by video ID (test mode shows
  // the ID of the song playing). Example: { "dQw4w9WgXcQ": 60, "kJQP7kiw5Fk": 70 }
  songVolume: {},

  // Fill the screen when a video has black bars at the top and bottom (wide
  // "cinema" videos). YouTube publishes three still frames of every video; the
  // page checks them for black bands and zooms in just enough to cover them, up
  // to 135%. A zoomed video loses a little on the left and right. false = off.
  autoZoom: true,

  // Zoom for particular songs on every TV, in percent, by video ID; this beats the
  // automatic zoom. On each TV, the remote's left/right arrows zoom the song that
  // is playing in or out, and that TV remembers it. Example: { "dQw4w9WgXcQ": 135 }
  songZoom: {},

  // Never show or play ads: the café screen stays up, silent, until the song
  // itself starts; an ad in the middle is covered and muted; and a song that
  // YouTube puts an ad in front of is skipped (it comes back in a later round).
  blockAds: true,

  // Keep YouTube's subtitles/captions off. (Lyrics that are part of the video
  // picture itself, like in karaoke videos, can't be removed.)
  noSubtitles: true,

  // Seconds to cut off the end of every video, to avoid the clickable end cards
  // some videos show in their last seconds. 0 = play every song to the end.
  cutEnding: 0,

  // Every song plays once before anything repeats. When a new shuffled round
  // starts, songs that just played are kept out of the next this-many spots.
  noRepeat: 20,

  // Optional, only for very big playlists: without a key, YouTube's player may
  // only hand over the first ~200 videos. A free YouTube Data API key reads them all.
  apiKey: "",

  // Opening hours, e.g. "10:00-02:00" (or "10:00-14:00, 17:00-01:00"). Outside them
  // the music stops and the café screen stays up; it starts again at opening time.
  // "" = always on.
  openHours: "",

  // Quieter or louder at times of day, in percent of normal, from each time on.
  // Example: { "10:00": 60, "18:00": 100 } = 60% from 10 in the morning, full
  // volume from 6 in the evening. {} = always normal.
  volumeSchedule: {},

  // Reloads itself between two songs after this many hours. Keeps the TV
  // fresh and picks up songs you add to the playlist.
  refreshHours: 12,

  // Playlists by time of day: from each time on, this playlist instead of the one at the
  // top. Example: { "10:00": "https://www.youtube.com/playlist?list=PL...", "18:00": "PL..." }
  // Before the first time, the last one still holds. {} = always the playlist at the top.
  playlistSchedule: {},

  // Never two songs by the same singer in a row. The singer is read from the song's
  // title ("Singer - Song") or, failing that, its YouTube channel.
  differentSinger: true,

  // The phone page's "Quiet for a minute" button: the music at this percent meanwhile.
  quietLevel: 15,

  // Minutes before closing time (openHours) in which the music slowly fades out. 0 = off.
  closingFade: 10,

    state.problems[id] = p;

    if (ids.length > 60) {                       // keep the 60 most recent
      ids.sort(function (a, b) { return state.problems[a].t - state.problems[b].t; });
      for (var i = 0; i < ids.length - 60; i++) delete state.problems[ids[i]];
    }
    save();
  }

  // New settings (settings.json, or saved on the phone page) take effect at once.
  // A different playlist or API key starts fresh with the next song.
  function checkAppSettings() {
    var v = appSettingsVersion;
    try { v = Number(APP.settingsVersion()) || 0; } catch (e) {}
    if (v === appSettingsVersion) return;
    appSettingsVersion = v;
    var oldList = S.playlist, oldKey = S.apiKey;
    applySettings(appSettings());
    if (S.playlist !== oldList || S.apiKey !== oldKey) pendingRestart = true;
    if (!URL_LIST && playlistId(scheduledList()) !== LIST) pendingRestart = true;
    document.getElementById("brandName").textContent = S.brandName || "";
    panelDirty = true;                           // prices, QR codes, words: drawn again
    prayerDay = "";
    singerCache = {};
    busyChannelList = null;
    layout();
    syncSound(true);
    noCaptions();
    scheduleAt = 0;                              // opening hours checked on the next tick
  }

  /* ---------- songs asked for on the phone, and the last songs played ---------- */

  // playnext: after the song playing now (after any others asked for); playnow: straight away;
  // unnext: off the list again. A song from a link (not in the playlist) plays the same way.
  function songCommand(what) {
    var c = what.indexOf(":"), kind = what.slice(0, c), id = what.slice(c + 1);
    var list = state.upNext.filter(function (v) { return v !== id; });
    if (kind === "playnext" && list.length >= 20) return false;
    if (kind === "playnext") list.push(id);
    if (kind === "playnow") list.unshift(id);
    state.upNext = list;
    save();
    panelDirty = true;
    if (kind !== "playnow" || !ready || !current) return true;   // not playing yet: it's simply first
    if (quiet) {                                 // music off: on again, with this song
      if (quiet === "closed") openAnywayUntil = Date.now() + 3 * 3600e3;
      if (quiet === "prayer") { var pr = prayerNow(Date.now()); prayerSkip = pr ? pr.key : ""; }
      quiet = "";
      holdUntil = 0;
      lastMove = Date.now();
      strikes = 0;
      next();
      return true;
    }
    startFadeOut(0.8);
    clearTimeout(skipTimer);
    skipTimer = setTimeout(next, 900);
    return true;
  }

  // The last 20 songs that really played on this TV (any playlist), for the phone page
  function history() {
    try {
      var h = JSON.parse(localStorage.getItem("tv-history"));
      return h instanceof Array ? h.filter(function (e) { return e && isId(e.id); }) : [];
    } catch (e) { return []; }
  }

  function addHistory(id) {
    if (!id) return;
    var h = history();
    h.push({ id: id, title: titleText(id), t: Date.now() });
    try { localStorage.setItem("tv-history", JSON.stringify(h.slice(-20))); } catch (e) {}
  }

  /* ---------- song names and singers ---------- */

  // A song's [title, channel]: from the app (YouTube's oEmbed), else from the player for the song on now
  function titleOf(id) {
    var t = X.titles && X.titles[id];
    if (t instanceof Array && t[0]) return [String(t[0]), String(t[1] || "")];
    if (id && id === current && player && ready && player.getVideoData) {
      var vd = player.getVideoData() || {};
      if (vd.video_id === id && vd.title) return [String(vd.title), String(vd.author || "")];
    }
    return null;
  }

  function titleText(id) {
    var t = titleOf(id);
    return t ? t[0] : "";
  }

  // "Singer - Song (Official Video) [4K] | other words" -> "Singer - Song"
  function cleanTitle(t) {
    t = String(t || "").replace(NOISE, "").split(/\s+[|｜]\s+/)[0];
    return t.replace(/#\S+/g, "").replace(/\s+[-–—]\s*$/, "").replace(/\s{2,}/g, " ").trim();
  }

  function cleanChannel(c) {
    return String(c || "").replace(/\s*-\s*Topic$/i, "").replace(/VEVO$/i, "").replace(/\s+(official|music|channel)$/i, "").trim();
  }

  // { song, singer } from a song's name: "Singer - Song", else the channel is the singer
  function songParts(id) {
    var t = titleOf(id);
    if (!t) return null;
    var title = cleanTitle(t[0]) || t[0], channel = cleanChannel(t[1]);
    var m = title.split(/\s+[-–—]\s+/);
    if (m.length >= 2 && m[0].length <= 60) return { song: m.slice(1).join(" - "), singer: m[0], fromTitle: true };
    return { song: title, singer: channel, fromTitle: false };
  }

  function nameKey(s) {
    return String(s || "").toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ").trim();
  }

  // Channels with songs by many singers (a TV channel, a record label) don't tell the singer
  function busyChannels() {
    if (busyChannelList) return busyChannelList;
    var count = {}, n = 0, k;
    for (var id in X.titles || {}) {
      k = X.titles[id] instanceof Array ? nameKey(cleanChannel(X.titles[id][1])) : "";
      if (k) { count[k] = (count[k] || 0) + 1; n++; }
    }
    busyChannelList = {};
    for (k in count) if (n >= 8 && count[k] > n * 0.4) busyChannelList[k] = true;
    return busyChannelList;
  }

  function singersOf(id) {
    if (singerCache[id]) return singerCache[id];
    var p = songParts(id), out = [];
    if (p && p.fromTitle) {
      p.singer.split(/\s*(?:,|&|\+|\s(?:x|X|feat\.?|ft\.?|with|and)\s|\sو\s)\s*/).forEach(function (n) {
        n = nameKey(n);
        if (n) out.push(n);
      });
    } else if (p && p.singer && !busyChannels()[nameKey(p.singer)]) {
      out.push(nameKey(p.singer));
    }
    if (p) singerCache[id] = out;               // no name yet: asked again once it arrives
    return out;
  }

  // "dashni" and "dashni morad" are the same singer (a name of 5 letters or more that starts the other)
  function sameName(a, b) {
    if (a === b) return true;
    var short = a.length < b.length ? a : b, long = a.length < b.length ? b : a;
    return short.length >= 5 && long.indexOf(short + " ") === 0;
  }

  function sameSinger(a, b) {
    var x = singersOf(a), y = singersOf(b);
    for (var i = 0; i < x.length; i++) for (var j = 0; j < y.length; j++) if (sameName(x[i], y[j])) return true;
    return false;
  }

  function upNextInfo() {
    var n = current ? chooseNext(false) : null;
    return n ? { id: n.id, title: titleText(n.id), asked: !!n.asked } : null;
  }

  /* ---------- from the app: song names, the weather, the café's pictures ---------- */

  function checkExtras() {
    if (!APP || typeof APP.extras !== "function") return;
    var v = -1;
    try { v = Number(APP.extrasVersion()); } catch (e) {}
    if (v === extrasVersion) return;
    extrasVersion = v;
    try { X = JSON.parse(APP.extras() || "{}") || {}; } catch (e) { X = {}; }
    pictureList = X.pictures instanceof Array ? X.pictures.filter(function (id) { return /^[a-z0-9]{6,24}$/.test(id); }) : [];
    singerCache = {};
    busyChannelList = null;
    panelDirty = true;
  }

  /* ---------- the call to prayer ---------- */

  // Prayer times, worked out the PrayTimes.org way: Muslim World League (Fajr 18°, Isha 17°),
  // Asr Shafi'i, Maghrib at sunset. Hours of the day (local time, tz = hours from UTC).
  function prayerTimes(y, m, d, lat, lon, tz) {
    var rad = Math.PI / 180;
    var sin = function (x) { return Math.sin(x * rad); }, cos = function (x) { return Math.cos(x * rad); };
    var tan = function (x) { return Math.tan(x * rad); }, asin = function (x) { return Math.asin(x) / rad; };
    var acos = function (x) { return Math.acos(x) / rad; }, atan2 = function (a, b) { return Math.atan2(a, b) / rad; };
    var acot = function (x) { return Math.atan(1 / x) / rad; };
    var fix = function (a, b) { a = a - b * Math.floor(a / b); return a < 0 ? a + b : a; };
    if (m <= 2) { y -= 1; m += 12; }
    var A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
    var jDate = Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5 - lon / (15 * 24);
    function sun(jd) {
      var D = jd - 2451545.0, g = fix(357.529 + 0.98560028 * D, 360), q = fix(280.459 + 0.98564736 * D, 360);
      var L = fix(q + 1.915 * sin(g) + 0.020 * sin(2 * g), 360), e = 23.439 - 0.00000036 * D;
      return { decl: asin(sin(e) * sin(L)), eqt: q / 15 - fix(atan2(cos(e) * sin(L), cos(L)) / 15, 24) };
    }
    function midDay(t) { return fix(12 - sun(jDate + t).eqt, 24); }
    function angleTime(angle, t, before) {
      var decl = sun(jDate + t).decl, noon = midDay(t);
      var T = acos((-sin(angle) - sin(decl) * sin(lat)) / (cos(decl) * cos(lat))) / 15;
      return noon + (before ? -T : T);
    }
    var r = {
      fajr: angleTime(18, 5 / 24, true), dhuhr: midDay(12 / 24),
      asr: angleTime(-acot(1 + tan(Math.abs(lat - sun(jDate + 13 / 24).decl))), 13 / 24),
      maghrib: angleTime(0.833, 18 / 24), isha: angleTime(17, 18 / 24)
    };
    for (var k in r) r[k] = fix(r[k] + tz - lon / 15, 24);
    return r;
  }

  // Today's prayer times, [{name, at (ms)}], each moved by its prayerAdjust minutes
  function todaysPrayers(now) {
    var d = new Date(now), lat = Number(S.lat), lon = Number(S.lon), adj = S.prayerAdjust || {};
    var key = d.toDateString() + JSON.stringify(adj) + lat + "," + lon;
    if (key === prayerDay) return prayerToday;
    prayerDay = key;
    prayerToday = [];
    if (isNaN(lat) || isNaN(lon) || Math.abs(lat) > 60) return prayerToday;   // (far north or south the sums don't hold)
    var tz = -new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12).getTimezoneOffset() / 60;
    var t = prayerTimes(d.getFullYear(), d.getMonth() + 1, d.getDate(), lat, lon, tz);
    PRAYERS.forEach(function (n) {
      if (isNaN(t[n])) return;
      var mins = Math.floor(t[n] * 60 + 0.5) + (Number(adj[n]) || 0);
      prayerToday.push({ name: n, at: new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, mins).getTime() });
    });
    return prayerToday;
  }

  // The prayer whose pause is now, if any: {name, until, key}
  function prayerNow(now) {
    var mins = Number(S.prayerPause) || 0, list = mins > 0 ? todaysPrayers(now) : [];
    for (var i = 0; i < list.length; i++) {
      if (now >= list[i].at && now < list[i].at + mins * 60e3) return { name: list[i].name, until: list[i].at + mins * 60e3, key: list[i].name + list[i].at };
    }
    return null;
  }

  /* ---------- special days ---------- */

  // The Umm al-Qura (Hijri) date, {d, m, y}, moved by hijriAdjust days
  function hijri(now) {
    var t = new Date(now + (Number(S.hijriAdjust) || 0) * DAY), k = t.toDateString();
    if (hijriMemo.k === k) return hijriMemo.v;
    var v = null;
    try {
      var o = {};
      new Intl.DateTimeFormat("en-u-ca-islamic-umalqura", { day: "numeric", month: "numeric", year: "numeric" }).formatToParts(t)
        .forEach(function (p) { o[p.type] = p.value; });
      v = { d: Number(o.day), m: Number(o.month), y: Number(o.year || o.relatedYear) };
      if (!v.d || !v.m) v = null;
    } catch (e) {}
    hijriMemo = { k: k, v: v };
    return v;
  }

  // Today's special day, if any: newroz, eidFitr, eidAdha, barat (Barat Night), newYear
  function activeDay() {
    var now = Date.now();
    if (now < lookUntil && DAYS[lookDay]) return lookDay;
    if (S.specialDays === false) return "";
    var d = new Date(now), m = d.getMonth() + 1, day = d.getDate(), h = hijri(now);
    if (h && h.m === 10 && h.d <= 3) return "eidFitr";
    if (h && h.m === 12 && h.d >= 10 && h.d <= 13) return "eidAdha";
    if (m === 3 && (day === 20 || day === 21)) return "newroz";
    if (h && h.m === 8 && (h.d === 14 || h.d === 15)) return "barat";
    if ((m === 12 && day === 31 && d.getHours() >= 18) || (m === 1 && day === 1)) return "newYear";
    return "";
  }

  function greeting(day) {
    if (day !== "newYear") return day ? L(day) : "";
    var d = new Date(Date.now());                  // on 31 December (and when shown from the phone): the coming year
    return L("newYear") + " " + (d.getMonth() === 0 ? d.getFullYear() : d.getFullYear() + 1);
  }

  function applyDay() {
    var day = activeDay(), brand = document.getElementById("brand"), want = day ? "day-" + day : "";
    if ((brand.getAttribute("data-look") || "") === want) return;
    for (var k in DAYS) brand.classList.remove("day-" + k);
    if (want) brand.classList.add(want);
    brand.setAttribute("data-look", want);
    panelDirty = true;
  }

  /* ---------- between songs: the café's name, messages and pictures ---------- */

  // The café's name first, then messages and pictures taking turns
  function slideList() {
    var msgs = (S.messages instanceof Array ? S.messages : []).map(function (m) { return String(m == null ? "" : m).trim(); })
                 .filter(Boolean).slice(0, 30);
    var pics = pictureList.slice(0, 30), list = [{ kind: "name" }];
    for (var i = 0; i < msgs.length || i < pics.length; i++) {
      if (i < msgs.length) list.push({ kind: "msg", text: msgs[i] });
      if (i < pics.length) list.push({ kind: "pic", id: pics[i] });
    }
    return list;
  }

  // The café screen comes up between two songs (or for a long while): the next one in turn.
  // During the call to prayer and a special day's look from the phone: the café's name.
  function nextSlide() {
    var list = slideList();
    slideIdx = quiet === "prayer" || Date.now() < lookUntil ? 0 : (slideIdx + 1) % list.length;
    showSlide(list[slideIdx] || list[0]);
    slideAt = Date.now();
    var after = list[(slideIdx + 1) % list.length];   // the next picture loads now, so it's ready in time
    if (after && after.kind === "pic") { var pre = new Image(); pre.src = "/tv/pictures/" + after.id + ".jpg"; }
  }

  function showSlide(item) {
    var box = document.getElementById("slide"), brand = document.getElementById("brand");
    var key = item.kind + ":" + (item.kind === "msg" ? item.text : item.id || "");
    if (key === slideShown) return;
    slideShown = key;
    var wasOn = box.className === "on";
    box.className = "";
    clearTimeout(slideTimer);
    if (item.kind === "name") { brand.classList.remove("slide-on"); return; }
    slideTimer = setTimeout(function () {         // the one before fades out first
      box.innerHTML = "";
      if (item.kind === "pic") {
        var img = document.createElement("img");
        img.alt = "";
        img.src = "/tv/pictures/" + item.id + ".jpg";
        box.appendChild(img);
      } else {
        var p = document.createElement("p"), n = item.text.length;
        p.className = "msg";
        p.dir = "auto";
        p.textContent = item.text;
        p.style.setProperty("--msg", (n <= 24 ? 8 : n <= 60 ? 6.4 : n <= 120 ? 5 : 4) + "cqmin");
        box.appendChild(p);
      }
      box.className = "on";
      brand.classList.add("slide-on");
    }, wasOn ? 600 : 0);
  }

  /* ---------- the info panel ---------- */

  function L(k) {
    var o = S.labels && typeof S.labels === "object" ? S.labels[k] : null;
    return o != null && String(o).trim() !== "" ? String(o) : LABELS[k] || "";
  }

  function $(id) {
    return document.getElementById(id);
  }

  function setText(id, text) {
    var e = $(id);
    if (e && e.textContent !== text) e.textContent = text;
  }

  // Starts at once (before YouTube): the clock works even with no internet
  function startPanel() {
    slideAt = Date.now();                        // the café's name first
    layout();
    checkExtras();
    panelTick();
    setInterval(panelTick, 1000);
  }

  function panelTick() {
    var now = Date.now();
    if (APP) checkExtras();
    applyDay();
    var note = quiet === "prayer" ? L("prayerNote") : greeting(activeDay());
    setText("brandNote", note);
    // A long while on the café screen (closed, paused, slow internet): the next message or picture
    if (!SETUP && pictureMode !== "show" && now - slideAt > 20000 && (slideList().length > 1 || slideIdx)) nextSlide();
    if (!panelOn) return;
    var d = new Date(now), loc = L("locale");
    var dir = /^(ckb|ar|fa|he|ur|ku-arab|sdh|lrc)\b/i.test(loc) ? "rtl" : "ltr";
    if ($("panel").dir !== dir) { $("panel").dir = dir; $("band").dir = dir; }
    draw("clock", d.getHours() + ":" + d.getMinutes() + S.clock24 + L("am") + L("pm"), drawClock, d);
    draw("date", d.toDateString() + (S.hijriAdjust || 0) + loc + greeting(activeDay()), drawDate, d);
    draw("weather", extrasVersion + ":" + d.getHours() + S.place + L("high") + L("low") + L("weatherCredit"), drawWeather, now);
    draw("music", musicKey(), drawMusic);
    draw("codes", JSON.stringify([S.menuUrl, S.wifiName, S.wifiPassword, L("menu"), L("menuHint"), L("wifi"), L("wifiPassword")]), drawCodes);
    draw("prices", JSON.stringify([S.prices, S.pricesAt, L("prices"), L("updated"), loc, S.clock24, d.toDateString()]), drawPrices);
    panelDirty = false;
  }

  // Each part of the panel is drawn again only when what it shows changed
  function draw(part, key, fn, arg) {
    if (!panelDirty && drawn[part] === key) return;
    drawn[part] = key;
    fn(arg);
  }

  // A time of day as on the clock: "9:05 PM" or "21:05"
  function clockText(ms) {
    var d = new Date(ms), h = d.getHours(), m = ("0" + d.getMinutes()).slice(-2);
    return S.clock24 ? ("0" + h).slice(-2) + ":" + m : (h % 12 || 12) + ":" + m + " " + (h < 12 ? L("am") : L("pm"));
  }

  function drawClock(d) {
    var h = d.getHours(), m = ("0" + d.getMinutes()).slice(-2);
    setText("time", (S.clock24 ? ("0" + h).slice(-2) : String(h % 12 || 12)) + ":" + m);
    setText("ampm", S.clock24 ? "" : h < 12 ? L("am") : L("pm"));
  }

  // Dates in the locale's language if the TV's engine knows it, else in British English
  function dateFormat(loc, opts) {
    try { if (Intl.DateTimeFormat.supportedLocalesOf([loc]).length) return new Intl.DateTimeFormat(loc, opts); } catch (e) {}
    return new Intl.DateTimeFormat("en-GB", opts);
  }

  // A label that is a list of names ("weekdays", "months", "hijriMonths"), if it has them all
  function names(k, n) {
    var a = L(k) ? L(k).split(/\s*[,\u060C]\s*/) : [];
    return a.length === n ? a : null;
  }

  function drawDate(d) {
    var days = names("weekdays", 7), months = names("months", 12), hm = names("hijriMonths", 12), h = hijri(d.getTime()), hj = "";
    setText("date", days && months ? days[d.getDay()] + " " + d.getDate() + " " + months[d.getMonth()]
                                   : dateFormat(L("locale"), { weekday: "long", day: "numeric", month: "long" }).format(d));
    if (h && hm) hj = h.d + " " + hm[h.m - 1] + " " + h.y;
    else {
      try {
        var opts = { calendar: "islamic-umalqura", day: "numeric", month: "long", year: "numeric" }, f = dateFormat(L("locale"), opts);
        if (f.resolvedOptions().calendar !== "islamic-umalqura") f = new Intl.DateTimeFormat("en-GB", opts);
        hj = f.format(new Date(d.getTime() + (Number(S.hijriAdjust) || 0) * DAY));
      } catch (e) {}
    }
    setText("hijri", hj);
    setText("greeting", greeting(activeDay()));
  }

  // The hour we're in, and the next 24 hours' highest and lowest, from the app's forecast
  function drawWeather(now) {
    var hours = X.weather && X.weather.hours instanceof Array ? X.weather.hours : [], cur = null, hi = -99, lo = 99;
    hours.forEach(function (h) {
      if (!(h instanceof Array) || h.length < 3 || typeof h[1] !== "number") return;
      if (h[0] <= now) cur = h;
      if (h[0] > now - 3600e3 && h[0] < now + 24 * 3600e3) { hi = Math.max(hi, h[1]); lo = Math.min(lo, h[1]); }
    });
    if (!cur && hours.length && hours[0] instanceof Array && hours[0][0] - now < 3600e3) cur = hours[0];
    if (cur && now - cur[0] > 2 * 3600e3) cur = null;   // an old forecast: nothing rather than wrong
    $("weather").hidden = !cur;
    setText("credit", cur ? L("weatherCredit") : "");
    if (!cur) return;
    var deg = function (t) { t = Math.round(t); return (t < 0 ? "−" + -t : String(t)) + "°"; };
    $("wicon").innerHTML = weatherIcon(cur[2]);
    setText("temp", deg(cur[1]));
    setText("wwords", L(weatherKind(cur[2])) || "");
    var line = $("whilo");
    line.innerHTML = "";
    [S.place || "", hi > -99 ? L("high") + " " + deg(hi) : "", lo < 99 ? L("low") + " " + deg(lo) : ""].forEach(function (t, i) {
      if (!t) return;
      var sp = document.createElement("span");
      sp.textContent = t;
      if (i === 0) sp.dir = "auto";
      line.appendChild(sp);
    });
  }

  function musicKey() {
    var n = current ? chooseNext(false) : null, a = current ? songParts(current) : null, b = n ? songParts(n.id) : null;
    return JSON.stringify([quiet, current, a, n && n.id, b, prayerUntil, L("nowPlaying"), L("upNext"), L("prayerBand"), S.clock24]);
  }

  // What's playing and what's next (or why the music stopped)
  function drawMusic() {
    var box = $("music");
    if (quiet === "prayer") {
      box.hidden = false;
      setText("nowLbl", "");
      setText("nowTitle", L("prayerBand"));
      setText("nowSinger", clockText(prayerUntil));
      $("nextLine").hidden = true;
      return;
    }
    var now = !quiet && current ? songParts(current) : null;
    box.hidden = !now;
    if (!now) return;
    setText("nowLbl", L("nowPlaying"));
    setText("nowTitle", now.song);
    setText("nowSinger", now.singer);
    var n = chooseNext(false), nx = n ? songParts(n.id) : null;
    $("nextLine").hidden = !nx;
    setText("nextLbl", L("upNext"));
    setText("nextTitle", nx ? nx.song + (nx.singer ? " – " + nx.singer : "") : "");
  }

  // "Dollar (100 $) = 147,250" -> ["Dollar (100 $)", "147,250"]; lines with no = or : stay whole
  function priceRows(text) {
    return String(text || "").split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean).slice(0, 12).map(function (l) {
      var m = /^(.*?)\s*[=:]\s*(.+)$/.exec(l);
      return m && m[1] ? [m[1], m[2]] : [l, ""];
    });
  }

  function drawPrices() {
    var rows = priceRows(S.prices), list = $("priceList"), at = Number(S.pricesAt) || 0;
    $("prices").hidden = !rows.length;
    setText("pricesHead", L("prices"));
    list.innerHTML = "";
    rows.forEach(function (r) {
      var row = document.createElement("div"), dt = document.createElement("dt"), dd = document.createElement("dd");
      dt.textContent = r[0];
      dt.dir = "auto";
      dd.textContent = r[1];
      dd.className = "num";
      dd.dir = "ltr";
      row.appendChild(dt);
      row.appendChild(dd);
      list.appendChild(row);
    });
    var when = "";
    if (at) {
      var d = new Date(at), today = new Date(Date.now()).toDateString() === d.toDateString();
      when = L("updated") + " " + (today ? "" : dateFormat(L("locale"), { day: "numeric", month: "short" }).format(d) + ", ") + clockText(at);
    }
    setText("pricesAt", when);
  }

  // A Wi-Fi QR code (phones join the network when they scan it); \ ; , : " are escaped
  function wifiText(name, password) {
    var esc = function (v) { return String(v).replace(/([\;,:"])/g, "\\$1"); };
    return "WIFI:T:" + (password ? "WPA" : "nopass") + ";S:" + esc(name) + ";" + (password ? "P:" + esc(password) + ";" : "") + ";";
  }

  // A QR code as a picture: dark squares on the card's light background, 2 squares of margin
  function qrSvg(text) {
    try {
      var q = qrcode(0, "M");
      q.addData(text, "Byte");
      q.make();
      var n = q.getModuleCount(), size = n + 4, d = "";
      for (var r = 0; r < n; r++) {
        for (var c = 0; c < n; c++) {
          if (!q.isDark(r, c)) continue;
          var run = 1;
          while (c + run < n && q.isDark(r, c + run)) run++;
          d += "M" + (c + 2) + " " + (r + 2) + "h" + run + "v1h-" + run + "z";
          c += run - 1;
        }
      }
      return '<svg viewBox="0 0 ' + size + " " + size + '" shape-rendering="crispEdges"><path fill="#0b1030" d="' + d + '"/></svg>';
    } catch (e) {
      return "";
    }
  }

  function drawCodes() {
    var menu = String(S.menuUrl || "").trim(), wifi = String(S.wifiName || "").trim(), pw = String(S.wifiPassword || "");
    $("menuCode").hidden = !menu;
    if (menu) {
      $("menuCode").querySelector(".qr").innerHTML = qrSvg(menu);
      setText("menuLbl", L("menu"));
      setText("menuHint", L("menuHint"));
    }
    $("wifiCode").hidden = !wifi;
    if (wifi) {
      $("wifiCode").querySelector(".qr").innerHTML = qrSvg(wifiText(wifi, pw));
      setText("wifiLbl", L("wifi"));
      setText("wifiName", wifi);
      setText("wifiPw", pw ? L("wifiPassword") + " " + pw : "");
    }
  }

  /* ---------- weather words and pictures ---------- */

  // MET Norway's symbol ("lightrainshowers_day") -> one of the panel's words
  function weatherKind(sym) {
    var b = String(sym || "").replace(/_(day|night|polartwilight)$/, "");
    if (/thunder/.test(b)) return "thunder";
    if (/sleet/.test(b)) return "sleet";
    if (/snow/.test(b)) return "snow";
    if (/^heavyrain/.test(b)) return "heavyrain";
    if (/^lightrain/.test(b)) return "lightrain";
    if (/rain/.test(b)) return "rain";
    if (b === "clearsky") return "clear";
    return /^(fair|partlycloudy|cloudy|fog)$/.test(b) ? b : "";
  }

  function weatherIcon(sym) {
    var kind = weatherKind(sym), night = /_night$/.test(sym);
    var sun = function (cx, cy, r) {
      var rays = "";
      for (var i = 0; i < 8; i++) {
        var a = i * Math.PI / 4, c = Math.cos(a), s = Math.sin(a);
        rays += '<line x1="' + (cx + c * (r + 4)).toFixed(1) + '" y1="' + (cy + s * (r + 4)).toFixed(1) + '" x2="' + (cx + c * (r + 9)).toFixed(1) + '" y2="' + (cy + s * (r + 9)).toFixed(1) + '"/>';
      }
      return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#ffcf8a"/><g stroke="#ffcf8a" stroke-width="3" stroke-linecap="round">' + rays + "</g>";
    };
    var moon = function (cx, cy, r) {
      return '<path fill="#ffdca8" d="M' + (cx + r * 0.35) + " " + (cy - r) + "A" + r + " " + r + " 0 1 0 " + (cx + r) + " " + (cy + r * 0.45) +
             "A" + r * 0.82 + " " + r * 0.82 + " 0 0 1 " + (cx + r * 0.35) + " " + (cy - r) + 'Z"/>';
    };
    var light = function (cx, cy, r) { return night ? moon(cx, cy, r) : sun(cx, cy, r); };
    var cloud = function (dy, fill) {
      return '<path fill="' + (fill || "#fff1e0") + '" transform="translate(0 ' + (dy || 0) + ')" d="M17 50H47A9.5 9.5 0 0 0 47.6 31A13 13 0 0 0 22.3 27.6A11.3 11.3 0 0 0 17 50Z"/>';
    };
    var drops = function (n, flakes) {
      var out = "";
      for (var i = 0; i < n; i++) {
        var x = 32 + (i - (n - 1) / 2) * 10;
        out += flakes && flakes(i) ? '<circle cx="' + x + '" cy="56" r="2.6" fill="#fff1e0"/>'
                                   : '<line x1="' + (x + 2) + '" y1="51" x2="' + (x - 2) + '" y2="60" stroke="#9cc8ff" stroke-width="3" stroke-linecap="round"/>';
      }
      return out;
    };
    var showers = /showers/.test(sym) ? light(19, 17, 8) : "";
    switch (kind) {
      case "clear": return light(32, 32, 13);
      case "fair": return light(26, 26, 11) + '<g transform="translate(14 14) scale(.62)">' + cloud() + "</g>";
      case "partlycloudy": return light(20, 19, 10.5) + '<g transform="translate(4 4)">' + cloud(2) + "</g>";
      case "cloudy": return '<g opacity=".55" transform="translate(-8 -8) scale(.8)">' + cloud() + "</g>" + cloud(2);
      case "fog": return '<g stroke="#fff1e0" stroke-width="3.5" stroke-linecap="round"><line x1="12" y1="26" x2="52" y2="26"/><line x1="8" y1="35" x2="48" y2="35"/><line x1="16" y1="44" x2="56" y2="44"/></g>';
      case "lightrain": return showers + cloud(-6) + drops(2);
      case "rain": return showers + cloud(-6) + drops(3);
      case "heavyrain": return showers + cloud(-6) + drops(4);
      case "sleet": return showers + cloud(-6) + drops(3, function (i) { return i !== 1; });
      case "snow": return showers + cloud(-6) + drops(3, function () { return true; });
      case "thunder": return cloud(-6) + '<path fill="#ffcf8a" d="M33 44L25 56H31L28 64L39 51H33L36 44Z"/>';
      default: return cloud(2);
    }
  }

  /* ---------- for the Android app: status and commands (phone control) ---------- */

  window.TwilightTV = {
    status: function () {
      var vd = (player && player.getVideoData && player.getVideoData()) || {};
      var good = allIds.filter(function (v) { return !state.bad[v]; }).length;
      var done = state.played.filter(function (v) { return !state.bad[v]; }).length;
      var problems = Object.keys(state.problems).map(function (id) {
        var p = state.problems[id];
        return { id: id, title: p.title || "", what: p.what || "", count: p.n || 1, last: p.t || 0 };
      }).sort(function (a, b) { return b.last - a.last; });
      return {
        name: S.brandName || "",
        playlist: LIST,
        songs: allIds.length,
        round: { done: done, total: good },
        song: current ? { id: current, title: vd.video_id === current ? vd.title || "" : "",
                          position: ready ? player.getCurrentTime() || 0 : 0,
                          duration: ready ? player.getDuration() || 0 : 0 } : null,
        state: !ready ? "starting" : quiet || (NAMES[player.getPlayerState()] || "?"),
        picture: pictureMode || "off",
        volume: current ? songVolume() : S.volume,
        scheduleVolume: scheduleVolume(),
        zoom: current ? songZoom() : 100,
        zoomNote: zoomNote(),
        muted: muted,
        quality: QUALITY[quality] || quality || "",
        openHours: String(S.openHours || ""),
        open: isOpen(),
        holdUntil: quiet === "paused" ? holdUntil : 0,
        adsSkipped: adsSkipped,
        problems: problems,
        upNext: upNextInfo(),
        asked: state.upNext.map(function (id) { return { id: id, title: titleText(id) }; }),
        history: history().slice().reverse(),
        quietUntil: quietUntil > Date.now() ? quietUntil : 0,
        quietLevel: Math.round(quietShare() * 100),
        prayers: Number(S.prayerPause) > 0 ? todaysPrayers(Date.now()).map(function (p) { return { name: p.name, at: p.at }; }) : [],
        prayerPause: Number(S.prayerPause) || 0,
        prayerUntil: quiet === "prayer" ? prayerUntil : 0,
        prayerName: quiet === "prayer" ? prayerName : "",
        closingIn: closingShare() < 1 ? Math.ceil(minutesToClose()) : 0,
        day: activeDay(),
        panel: panelOn
      };
    },
    // The songs the app should find names for: the playlist, then any asked for from a link
    songIds: function () {
      var more = state.upNext.concat(current ? [current] : []).filter(function (v) { return allIds.indexOf(v) < 0; });
      return unique(allIds.concat(more));
    },
    // The page's built-in settings (for the phone page's Settings screen) and the ones in use
    settingsInfo: function () {
      return { defaults: Object.assign({ labelWords: LABELS }, DEFAULTS), current: S };   // (labelWords: the TV's words, for the phone)
    },
    // next, pause, resume, vol+, vol-, zoom+, zoom-, identify:<name>, reload, forget,
    // playnext:<video id>, playnow:<id>, unnext:<id>, quiet:<seconds> (0 = back to normal), look:<special day>
    command: function (what) {
      what = String(what || "");
      if (/^(playnext|playnow|unnext):[\w-]{11}$/.test(what)) return songCommand(what);
      if (/^quiet:\d{1,4}$/.test(what)) {
        var secs = Math.min(Number(what.slice(6)), 1800), now = Date.now();
        quietUntil = secs ? Math.min(Math.max(now, quietUntil) + secs * 1000, now + 30 * 60e3) : 0;   // pressed again: longer
        return true;
      }
      if (/^look:\w{1,20}$/.test(what)) {
        if (!DAYS[what.slice(5)]) return false;
        lookDay = what.slice(5);
        lookUntil = Date.now() + 20e3;           // the café screen with that day's look, for 20 seconds
        slideIdx = 0;
        showSlide({ kind: "name" });
        applyDay();
        syncPicture();
        return true;
      }
      if (what === "forget") {                   // this TV's memory: shuffle history, song volumes, zooms, problem list
        try { localStorage.removeItem(KEY); } catch (e) {}
        state = load();
        reloading = false;
        refresh();
        return true;
      }
      if (what === "reload") { reloading = false; refresh(); return true; }
      if (!ready || !current) return false;
      if (what === "next") {
        if (quiet === "paused") { quietSince = 0; resume(); return true; }
        if (quiet) return false;
        startFadeOut(0.8);
        clearTimeout(skipTimer);
        skipTimer = setTimeout(next, 900);
      }
      else if (what === "pause") { if (quiet !== "closed") { goQuiet("paused"); holdUntil = Date.now() + 3 * 3600e3; } }
      else if (what === "resume") {
        if (quiet === "closed") { openAnywayUntil = Date.now() + 3 * 3600e3; resume(); }
        else if (quiet === "prayer") { var pr = prayerNow(Date.now()); prayerSkip = pr ? pr.key : ""; resume(); }   // this time without the pause
        else resume();
      }
      else if (what === "vol+" || what === "vol-") changeSongVolume(what === "vol+" ? 10 : -10);
      else if (what === "zoom+" || what === "zoom-") changeSongZoom(what === "zoom+" ? 1 : -1);
      else if (what.indexOf("identify:") === 0) toast(what.slice(9), 6000);
      else return false;
      return true;
    }
  };

  /* ---------- full screen, taps and keys, staying awake ---------- */

  // Browsers only allow full screen after a tap or key press, unless the device
  // (OptiSigns, kiosk mode) already shows the page full screen.
  function goFullscreen() {
    var d = document, el = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) return;
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) return;
    try {
      var p = req.call(el, { navigationUI: "hide" });
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  }

  function keepAwake() {
    try {
      if (navigator.wakeLock && !document.hidden) navigator.wakeLock.request("screen").catch(function () {});
    } catch (e) {}
  }

  // Any tap, click or remote button press: full screen, and sound on if it was blocked
  function onUserAction() {
    goFullscreen();
    if (!ready || !current || SETUP) return;     // in quality setup, YouTube's own controls decide
    if (autoplayDead) { autoplayDead = false; hideNote(); }
    if (muted) { setMuted(false); syncSound(true); }
    player.playVideo();
  }
  ["pointerdown", "pointerup", "touchend", "mousedown", "click", "keydown"].forEach(function (ev) {
    document.addEventListener(ev, onUserAction, { capture: true, passive: true });
  });
  document.addEventListener("keydown", function (e) {
    if (SETUP) return;                           // quality setup: the remote moves around YouTube's menu
    var up = e.key === "ArrowUp" || e.key === "+" || e.key === "=";
    var down = e.key === "ArrowDown" || e.key === "-";
    if (up || down) changeSongVolume(up ? 10 : -10);
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") changeSongZoom(e.key === "ArrowRight" ? 1 : -1);
  }, true);
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) return;
    keepAwake();
    if (ready && current) kick();
  });

  /* ---------- helpers ---------- */

  // Setup problems only: a short message on the screen
  function note(html) {
    var n = document.getElementById("note");
    n.innerHTML = html;
    n.style.display = "block";
    noteShown = true;
  }

  function hideNote() {
    if (!noteShown) return;
    document.getElementById("note").style.display = "none";
    noteShown = false;
  }

  // Planned reload between two songs. If the page's address doesn't answer,
  // keep playing and try again in 15 minutes.
  function refresh() {
    reloading = true;
    fetch(location.href, { cache: "no-store" })
      .then(function (r) { if (r.ok) location.reload(); else throw new Error(); })
      .catch(function () {
        reloading = false;
        loadedAt = Date.now() - S.refreshHours * 3600e3 + 15 * 60e3;
        next();
      });
  }

  // Recovery reload. Waits until the page's address answers, so an internet
  // drop never leaves the TV stuck on a "no connection" screen.
  function reloadSoon(ms) {
    if (reloading) return;
    reloading = true;
    setTimeout(function attempt() {
      if (!/^https?:$/.test(location.protocol)) return location.reload();
      fetch(location.href, { cache: "no-store" })
        .then(function (r) { if (r.ok) location.reload(); else throw new Error(); })
        .catch(function () { setTimeout(attempt, 30e3); });
    }, ms || 0);
  }

  /* ---------- test mode (?debug=1) ---------- */

  // The web engine's version: Android System WebView (an old one plays YouTube but doesn't
  // draw its controls), or Firefox's, in the test version of the app
  function engine() {
    var m = /(Chrome|Firefox)\/(\d+)/.exec(navigator.userAgent);
    return m ? m[1] + " " + m[2] + (m[1] === "Chrome" && +m[2] < 110 ? " (old)" : "") : "unknown";
  }
  var NAMES = { "-1": "starting", "0": "ended", "1": "playing", "2": "paused", "3": "loading", "5": "ready" };
  var QUALITY = { tiny: "144p", small: "240p", medium: "360p", large: "480p", hd720: "720p", hd1080: "1080p",
                  hd1440: "1440p", hd2160: "2160p (4K)", hd2880: "2880p", highres: "above 1080p (1440p / 4K)" };

  function mmss(s) {
    s = Math.max(0, Math.floor(s || 0));
    return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
  }

  function debugInfo() {
    var fs = !!(document.fullscreenElement || document.webkitFullscreenElement);
    var lines = ["Playlist " + LIST];
    if (!ready) lines.push("Waiting for YouTube...");
    else if (!current) lines.push("Reading the playlist...");
    else {
      var good = allIds.filter(function (v) { return !state.bad[v]; }).length;
      var done = state.played.filter(function (v) { return !state.bad[v]; }).length;
      var vd = (player.getVideoData && player.getVideoData()) || {};
      lines.push(allIds.length + " videos, " + source);
      lines.push("This round: song " + done + " of " + good);
      lines.push("Now: " + (vd.title || "") + "  [" + current + "]");
      lines.push((NAMES[player.getPlayerState()] || "?") + "  " + mmss(player.getCurrentTime()) + " / " +
                 mmss(player.getDuration()) + "   picture " + (pictureMode || "off"));
      lines.push("Zoom " + songZoom() + "% (" + zoomNote() + "; remote left/right to change)");
      lines.push("Sound " + (muted ? "OFF (tap the screen or press OK)" : lastSentMute ? "held (loading / ad / fade)" : "on at " + lastSentVol + "%") +
                 ", this song's volume " + songVolume() + "% (remote up/down to change)");
      lines.push("Opening hours " + (S.openHours ? S.openHours + (isOpen() ? " (open now)" : " (closed now)") : "not set") +
                 ", volume schedule " + scheduleVolume() + "% of normal now" +
                 (quiet === "closed" ? "   MUSIC OFF: outside opening hours" : quiet === "paused" ? "   MUSIC OFF: paused from the phone" :
                  quiet === "prayer" ? "   MUSIC OFF: call to prayer until " + clockText(prayerUntil) : ""));
      var nx = upNextInfo(), pr = Number(S.prayerPause) > 0 ? todaysPrayers(Date.now()) : [];
      lines.push("Up next: " + (nx ? (nx.title || nx.id) + (nx.asked ? " (asked for on the phone)" : "") : "-") +
                 (state.upNext.length > 1 ? ", then " + (state.upNext.length - 1) + " more asked for" : "") +
                 "   song names known: " + Object.keys(X.titles || {}).length + (Date.now() < quietUntil ? "   QUIET until " + clockText(quietUntil) : ""));
      lines.push("Call to prayer: " + (pr.length ? pr.map(function (p) { return p.name + " " + clockText(p.at); }).join(", ") +
                 " (" + S.prayerPause + " min)" : "no pause") + (activeDay() ? "   special day: " + activeDay() : ""));
      var pids = Object.keys(state.problems);
      if (pids.length) lines.push("Songs that won't play: " + pids.length + " (listed on the phone page): " + pids.slice(0, 4).join(", "));
      lines.push("Quality: " + (QUALITY[quality] || quality || "not reported yet") +
                 "   (player drawn at " + renderW + "x" + renderH + ")");
      lines.push("Ad blocking " + (!S.blockAds ? "off" : adBlocking() ? "on" : "paused for a while (6 skips in a row)") +
                 ": " + adsSkipped + " ads skipped   subtitles " + (S.noSubtitles ? "off" : "allowed") +
                 "   fade in " + (Number(S.fadeIn) || 0) + "s / out " + (Number(S.fadeOut) || 0) + "s, title hidden " +
                 (Number(S.titleSeconds) || 0) + "s");
    }
    lines.push("Screen " + window.innerWidth + "x" + window.innerHeight + ", full screen " + (fs ? "yes" : "no") + ", web engine " + engine() +
               ", info panel " + (panelOn ? "on" : "off") + (X.weather ? ", weather from the app" : ""));
    if (skipped.length) lines.push("Skipped: " + skipped.join(", "));
    var box = document.getElementById("debug");
    box.textContent = lines.join("\n");
    box.style.display = "block";
  }
  if (DEBUG) setInterval(debugInfo, 1000);

  /* ---------- start ---------- */

  window.onYouTubeIframeAPIReady = function () {
    var vars = { autoplay: 0, controls: SETUP ? 1 : 0, disablekb: 1, fs: 0, rel: 0, iv_load_policy: 3, playsinline: 1 };
    if (S.noSubtitles) vars.cc_load_policy = 0;
    if (/^https?:$/.test(location.protocol)) vars.origin = location.origin;
    player = new YT.Player("player", {
      width: 3840,
      height: 2160,
      playerVars: vars,
      events: {
        onReady: onReady,
        onStateChange: onStateChange,
        onError: onError,
        onAutoplayBlocked: onAutoplayBlocked,
        onApiChange: onApiChange,
        onPlaybackQualityChange: function (e) { quality = e.data; }
      }
    });
    layout();
  };

  var tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  tag.onerror = function () { reloadSoon(30e3); };
  document.head.appendChild(tag);
  setTimeout(function () { if (!ready) reloadSoon(0); }, 60e3);
  goFullscreen();      // only works where the device allows it without a tap
  keepAwake();
})();
</script>
</body>
</html>
