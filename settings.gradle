pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Mozilla's own: GeckoView, Firefox's engine, for the test version of the app
        maven {
            url "https://maven.mozilla.org/maven2/"
            content { includeGroup "org.mozilla.geckoview" }
        }
    }
}

rootProject.name = "TwilightTV"
include ':app'
